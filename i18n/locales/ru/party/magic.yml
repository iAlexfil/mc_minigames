second_wind_saved: "Второе дыхание спасло тебя: осталось 6 здоровья!"
spell.flame_cone.name: "Конус пламени"
spell.flame_cone.description: "Обжигает видимый конус до 8 блоков: 7 урона и горение на 4 с."
spell.cinder_rain.name: "Пепельный дождь"
spell.cinder_rain.description: "Через 1 с создаёт зону радиусом 4 на 5 с на дальности до 48 блоков: 3 урона/с и горение. Укрытия защищают."
spell.phoenix_step.name: "Шаг феникса"
spell.phoenix_step.description: "Рывок вперёд оставляет огненный след на 3 с: 3 урона/с и поджог врагов. Не защищает от падения."
spell.combustion.name: "Воспламенение"
spell.combustion.description: "Поглощает горение видимых врагов в радиусе 10 блоков, нанося 10 урона. Нужна хотя бы одна горящая цель."
spell.blizzard.name: "Метель"
spell.blizzard.description: "Через 0,7 с создаёт метель радиусом 4 на 5 с на дальности до 48 блоков: 2 урона/с и замедление II."
spell.frozen_orb.name: "Морозная сфера"
spell.frozen_orb.description: "При попадании взрывается: 6→3 урона в радиусе 3,5 блока и замедление II на 4 с. Можно отразить."
spell.ice_armor.name: "Ледяной доспех"
spell.ice_armor.description: "Даёт 6 дополнительного здоровья поглощения на 5 с. Неизрасходованные временные сердца затем исчезают."
spell.shatter.name: "Раскол"
spell.shatter.description: "Бьёт по видимому конусу до 9 блоков: 11 урона замедленным врагам, иначе 4. При попадании снимает замедление."
spell.chain_lightning.name: "Цепная молния"
spell.chain_lightning.description: "Наведи на врага до 36 блоков: молния перескочит ещё к двум целям до 8 блоков за скачок, нанося 8/6/4 урона. Укрытия защищают."
spell.updraft.name: "Восходящий поток"
spell.updraft.description: "Через 0,7 с создаёт поток радиусом 3 на 4 с в пределах 48 блоков. Поднимает всех магов внутри; враги получают 1 урона/с."
spell.dispel.name: "Рассеивание"
spell.dispel.description: "Убирает видимые вражеские снаряды, отмеченные удары и зоны в радиусе 7 блоков; ближайшим врагам наносит 2 урона и отталкивает. Постройки сохраняются."
spell.skyhook.name: "Небесный крюк"
spell.skyhook.description: "Наведи на блок до 32 блоков, чтобы бросить себя в его сторону. Стены останавливают полёт; не телепортирует и не защищает от падения."
spell.stone_dome.name: "Каменный купол"
spell.stone_dome.description: "Строит вокруг тебя небольшое укрытие 5×5 с крышей на 5 с. Пропускает карту и тела игроков; враги могут ломать его блоки."
spell.fault_line.name: "Разлом земли"
spell.fault_line.description: "Узкая пробивающая волна у земли до 20 блоков: 8 урона и подброс врагов. Твёрдое укрытие останавливает её."
spell.erode.name: "Эрозия"
spell.erode.description: "Через 0,7 с удаляет блоки карты и постройки в радиусе 4 на дальности до 48 блоков. Не наносит урон."
spell.pillar.name: "Каменный столп"
spell.pillar.description: "Поднимает тебя на 3 блока на временном столпе на 8 с. Нужно свободное место сверху; не проходит через потолок и других игроков."
spell.purify.name: "Очищение"
spell.purify.description: "Снимает вредные эффекты зелий, горение и замерзание, затем лечит 2 здоровья. Нужен хотя бы один снимаемый эффект."
spell.second_wind.name: "Второе дыхание"
spell.second_wind.description: "На 8 с: первый смертельный урон оставляет тебя в живых с 6 здоровья и тушит огонь. Один раз; от пустоты не спасает."
spell.life_tether.name: "Нить жизни"
spell.life_tether.description: "Отражаемый снаряд наносит 5 урона и восстанавливает тебе 2 здоровья только при попадании с уроном."
spell.mana_channel.name: "Сосредоточение"
spell.mana_channel.description: "При мане не выше 65 потрать 8 маны и стой без заклинаний 2 с, чтобы вернуть 48. Движение или урон прерывают; потраченная мана не возвращается."
spell.silence.name: "Безмолвие"
spell.silence.description: "Отражаемый снаряд наносит 3 урона и запрещает врагу колдовать на 2 с. Двигаться и строить всё ещё можно."
spell.swap.name: "Обмен местами"
spell.swap.description: "Наведи на врага до 24 блоков, чтобы поменяться местами. Оба должны стоять на твёрдом блоке со свободным местом для тела внутри границы."
spell.rewind.name: "Возврат"
spell.rewind.description: "Возвращает туда, где ты был 3 с назад, сохраняя здоровье, ману и КД. Не работает, если место занято, перекрыто или за границей."
spell.dark_veil.name: "Тёмная завеса"
spell.dark_veil.description: "Даёт невидимость на 5 с и оставляет завесу радиусом 5 на 5 с, кратко ослепляющую видимых врагов внутри. Предмет в руке остаётся видимым."
