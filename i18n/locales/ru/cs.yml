rules: "Разминирование: возрождение только в следующем раунде. Закупка на спавне; удерживайте ПКМ с предметом в слоте 8 для установки C4 на A/B или разминирования. Управление: /cs help."
map_credit: "Dust II: xjqsh / LesRaisinsStudio; оригинальная карта: Valve. Карта используется на некоммерческих условиях автора."
