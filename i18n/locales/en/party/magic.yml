spell.firebolt.name: "Firebolt"
spell.firebolt.description: "Fast projectile: 6 damage and burning for 3 s."
spell.fireball.name: "Fireball"
spell.fireball.description: "Explodes on impact: 10→4 damage within 3 blocks, burns for 4 s and destroys nearby terrain and buildings."
spell.meteor.name: "Meteor"
spell.meteor.description: "Aimed strike after a 1.2 s warning: 14→4 damage in a 4.5-block radius, burns and breaks terrain and buildings."
spell.ice_lance.name: "Ice Lance"
spell.ice_lance.description: "Projectile: 5 damage and Slowness II for 3 s."
spell.frost_nova.name: "Frost Nova"
spell.frost_nova.description: "Visible enemies within 6 blocks take 6 damage and Slowness III for 2 s; extinguishes you."
spell.ice_wall.name: "Ice Wall"
spell.ice_wall.description: "Creates a 5×3 ice wall up to 12 blocks away for 8 s. Will not replace terrain or trap bodies."
spell.gale.name: "Gale"
spell.gale.description: "Projectile: 4 damage with strong knockback. Knock enemies off their bridges."
spell.wind_step.name: "Wind Step"
spell.wind_step.description: "Fast forward dash with a small lift; can rescue you in midair. No fall immunity."
spell.thunder.name: "Thunderstrike"
spell.thunder.description: "Aimed lightning after a 0.8 s warning: 10→4 damage within 3 blocks, reveals enemies for 4 s."
spell.stone_shot.name: "Stone Shot"
spell.stone_shot.description: "Accurate long-range projectile dealing 7 damage."
spell.bridge.name: "Earth Bridge"
spell.bridge.description: "Creates up to 12 planks forward under your feet for 20 s."
spell.quake.name: "Earthquake"
spell.quake.description: "After a 0.7 s warning, deals 8 damage within 5 blocks and launches enemies upward. Destroys terrain and buildings."
spell.mend.name: "Mend"
spell.mend.description: "Instantly restores 6 health. Cannot be spent at full health."
spell.aegis.name: "Aegis"
spell.aegis.description: "For 3 s reflects incoming spell projectiles and halves other damage. A projectile can reflect only once."
spell.sanctuary.name: "Sanctuary"
spell.sanctuary.description: "Creates a fixed 4-block zone for 6 s: while inside, you gain 1 health and 8 mana each second."
spell.rift.name: "Rift Bolt"
spell.rift.description: "Projectile: 7 damage, drains up to 8 enemy mana and restores half to you."
spell.blink.name: "Blink"
spell.blink.description: "Teleports up to 10 blocks along your gaze, including midair; cannot pass through solid blocks."
spell.gravity_well.name: "Gravity Well"
spell.gravity_well.description: "After a 0.7 s warning, pulls visible enemies within 5 blocks for 3 s and deals 2 damage each second."
book.title: "Spellbook • 42 spells"
