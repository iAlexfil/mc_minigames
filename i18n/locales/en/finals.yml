gadget.evasive_dash.name: "Evasive Dash"
gadget.evasive_dash.lore: "Right-click: dash forward. Three charges recharge separately."
gadget.frag_grenade.name: "Frag Grenade"
gadget.frag_grenade.lore: "Right-click: throw a bouncing grenade. Explodes after 1.6 s; can hurt you."
gadget.sonar_grenade.name: "Sonar Grenade"
gadget.sonar_grenade.lore: "Right-click: reveal enemies within 9 blocks for 5 s, including cloaked enemies."
gadget.vanishing_bomb.name: "Vanishing Bomb"
gadget.vanishing_bomb.lore: "Right-click: hide yourself and gear from enemies for 5 s. Attacking reveals you."
gadget.healing_beam.name: "Healing Beam"
gadget.healing_beam.lore: "Right-click: heal an ally in sight for 3 s. Keep holding; self-healing is weaker."
gadget.jump_pad.name: "Jump Pad"
gadget.jump_pad.lore: "Right-click a floor: place a 15 s jump pad. Step on it to launch."
gadget.defibrillator.name: "Defibrillator"
gadget.defibrillator.lore: "Right-click a fallen ally within 4 blocks. In 2v2/3v3: aim and hold this gadget for a 1s charge, then a 3s rebuild at half health with 5s gadget lockout."
gadget.revive_sickness: "Revive sickness: gadgets and specialization are temporarily unavailable."
gadget.charge_n_slam.name: "Charge 'n' Slam"
gadget.charge_n_slam.lore: "Right-click: charge for 1 s, break light cover, and hit each enemy once."
gadget.rpg7.name: "RPG-7"
gadget.rpg7.lore: "Right-click: fire a rocket. Impact blast damages enemies, yourself, and light cover."
gadget.dome_shield.name: "Dome Shield"
gadget.dome_shield.lore: "Right-click: 8 s allied shield. Enemies can enter; cashbox carriers stay vulnerable."
gadget.barricade.name: "Barricade"
gadget.barricade.lore: "Right-click a floor: place destructible 3x2 cover for 20 s."
gadget.cloaking_device.name: "Cloaking Device"
gadget.cloaking_device.lore: "Hide from enemies for 10 seconds. Attacking, taking damage or carrying cash reveals you. Right-click again to cancel."
gadget.grappling_hook.name: "Grappling Hook"
gadget.grappling_hook.lore: "Right-click a solid surface within 22 blocks to pull yourself toward it. Right-click again to release."
gadget.guardian_turret.name: "Guardian Turret"
gadget.guardian_turret.lore: "Place one destructible turret. Arms in 2 seconds and fires at visible enemies for up to 30 seconds."
gadget.dematerializer.name: "Dematerializer"
gadget.dematerializer.lore: "Temporarily open a 3×3 hole in destructible terrain. Restores after 8 seconds when the space is clear."
gadget.mesh_shield.name: "Mesh Shield"
gadget.mesh_shield.lore: "Hold this specialization to shield allies from attacks in front for 6 seconds. Switch slots or right-click again to lower it."
gadget.winch_claw.name: "Winch Claw"
gadget.winch_claw.lore: "Right-click an enemy, cashbox or cashout within 14 blocks to pull it toward you. Walls stop the pull."
gadget.smoke_grenade.name: "Smoke Grenade"
gadget.smoke_grenade.lore: "Throw an 8-second smoke cloud that obscures enemies and extinguishes fire zones."
gadget.flashbang.name: "Flashbang"
gadget.flashbang.lore: "Throw to blind visible enemies nearby for 3 seconds."
gadget.gas_grenade.name: "Gas Grenade"
gadget.gas_grenade.lore: "Throw an 8-second damaging gas cloud. Fire clears the gas."
gadget.pyro_grenade.name: "Pyro Grenade"
gadget.pyro_grenade.lore: "Ignites a damaging area for 8 seconds on impact. Smoke extinguishes it."
gadget.goo_grenade.name: "Goo Grenade"
gadget.goo_grenade.lore: "Creates temporary destructible cover on impact. Protected locations stay clear."
gadget.breach_charge.name: "Breach Charge"
gadget.breach_charge.lore: "Place a remote explosive on a floor. After arming, right-click again to detonate and breach nearby cover."
gadget.explosive_mine.name: "Explosive Mine"
gadget.explosive_mine.lore: "Place an armed proximity trap that explodes when a visible enemy approaches. Can be shot."
gadget.gas_mine.name: "Gas Mine"
gadget.gas_mine.lore: "Place a proximity trap that releases damaging gas when a visible enemy approaches."
gadget.pyro_mine.name: "Pyro Mine"
gadget.pyro_mine.lore: "Place a proximity trap that ignites the area when a visible enemy approaches."
gadget.aps_turret.name: "APS Turret"
gadget.aps_turret.lore: "Place a destructible device that intercepts up to six enemy grenades or rockets within 3 blocks."
