team.blue: "Blue"
loading: "Loading Dust II: <arg:0>%"
rules: "Bomb Defusal: no respawns until the next round. Buy at spawn; hold right-click with slot 8 to plant C4 at A/B or defuse it. /cs help shows controls."
map_credit: "Dust II: xjqsh / LesRaisinsStudio; original map: Valve. Map used under the author’s non-commercial terms."
controls: "Right-click: fire/throw/use. Left-click: knife or toggle scope on supported rifles. F: reload. Q: drop. Slot 8: hold right-click to plant/defuse. Slot 9: radar; right-click to buy at spawn, sneak + right-click for the roster. /cs score: alive/dead roster. !message: team chat. Drop your current gun before picking up another. Sneak: quiet steps; after death, sneak to switch teammates. /cs pause: tactical timeout."
controls.gun: "Right-click: fire • F: reload • Q: drop"
controls.throw: "Right-click: throw. Up to four grenades, including two flashes."
controls.knife: "Left-click: quick slash • Right-click: heavy stab • Backstabs deal more damage."
controls.plant: "At A/B, stand still on the ground and hold right-click for 3.2 seconds. Q: drop."
controls.defuse: "Look at planted C4 within three blocks and hold right-click for <arg:0> seconds."
controls.buy: "Hold to see the radar. Right-click at spawn to buy; sneak + right-click or /cs score: alive/dead roster."
