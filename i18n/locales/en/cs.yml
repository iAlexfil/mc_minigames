# Standalone Counter-Strike bomb-defusal mode.
name: "Counter-Strike"
mode.default: "Bomb Defusal • Dust II"
description: "T against CT: buy weapons, plant or defuse C4 and win rounds."
error.player: "This command requires a player."
error.not_playing: "Join Counter-Strike first: /play cs."
error.roster: "Counter-Strike needs 2–10 players, or one player in test mode."
