spell.firebolt.name: "Огненная стрела"
spell.firebolt.description: "Быстрый снаряд: 6 урона и горение на 3 с."
spell.fireball.name: "Огненный шар"
spell.fireball.description: "Взрыв при попадании: 10→4 урона в радиусе 3 блоков, горение на 4 с, разрушает блоки карты и постройки рядом."
spell.meteor.name: "Метеор"
spell.meteor.description: "Удар по метке через 1,2 с: 14→4 урона в радиусе 4,5 блока, поджигает и разрушает блоки карты и постройки."
spell.ice_lance.name: "Ледяное копьё"
spell.ice_lance.description: "Снаряд: 5 урона и замедление II на 3 с."
spell.frost_nova.name: "Кольцо мороза"
spell.frost_nova.description: "Видимые враги в радиусе 6 блоков получают 6 урона и замедление III на 2 с; тушит огонь на тебе."
spell.ice_wall.name: "Ледяная стена"
spell.ice_wall.description: "Создаёт ледяную стену 5×3 до 12 блоков от тебя на 8 с. Не заменяет карту и не замуровывает игроков."
spell.gale.name: "Порыв"
spell.gale.description: "Снаряд: 4 урона и сильное отталкивание. Сбрасывает противников с мостов."
spell.wind_step.name: "Шаг ветра"
spell.wind_step.description: "Резкий рывок вперёд с небольшим подъёмом, работает в воздухе. Не даёт защиты от падения."
spell.thunder.name: "Грозовой удар"
spell.thunder.description: "Молния по метке через 0,8 с: 10→4 урона в радиусе 3 блоков, подсветка врагов на 4 с."
spell.stone_shot.name: "Каменный снаряд"
spell.stone_shot.description: "Точный дальнобойный снаряд, наносит 7 урона."
spell.bridge.name: "Земляной мост"
spell.bridge.description: "Создаёт впереди под ногами до 12 досок на 20 с."
spell.quake.name: "Землетрясение"
spell.quake.description: "Через 0,7 с наносит 8 урона в радиусе 5 блоков и подбрасывает врагов. Разрушает блоки карты и постройки."
spell.mend.name: "Исцеление"
spell.mend.description: "Мгновенно восстанавливает 6 здоровья. При полном здоровье не расходуется."
spell.aegis.name: "Эгида"
spell.aegis.description: "На 3 с отражает летящие заклинания и вдвое уменьшает остальной урон. Снаряд отражается не более одного раза."
spell.sanctuary.name: "Святилище"
spell.sanctuary.description: "Создаёт зону радиусом 4 блока на 6 с: находясь внутри, ты получаешь 1 здоровья и 8 маны в секунду."
spell.rift.name: "Разлом"
spell.rift.description: "Снаряд: 7 урона, отнимает до 8 маны врага и возвращает половину тебе."
spell.blink.name: "Скачок"
spell.blink.description: "Телепортирует до 10 блоков по взгляду, в том числе в воздухе; не проходит через твёрдые блоки."
spell.gravity_well.name: "Гравитационный колодец"
spell.gravity_well.description: "Через 0,7 с на 3 с притягивает видимых врагов в радиусе 5 блоков и наносит 2 урона в секунду."
