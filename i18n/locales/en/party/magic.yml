channel_interrupted: "Focus interrupted; spent mana is not refunded"
channel_complete: "Focus complete: +48 mana"
silenced: "Silenced • <arg:0> s without spells"
second_wind_saved: "Second Wind saved you: 6 health remaining!"
spell.flame_cone.name: "Flame Cone"
spell.flame_cone.description: "Scorches a visible cone up to 8 blocks away: 7 damage and burning for 4 s."
spell.cinder_rain.name: "Cinder Rain"
spell.cinder_rain.description: "After a 1 s warning, creates a radius-4 zone for 5 s up to 48 blocks away: 3 damage/s and burning. Cover blocks it."
spell.phoenix_step.name: "Phoenix Step"
spell.phoenix_step.description: "Dashes forward, leaving a 3 s flame trail that deals 3 damage/s and ignites enemies. No fall immunity."
spell.combustion.name: "Combustion"
spell.combustion.description: "Consumes burning on visible enemies within 10 blocks to deal 10 instant damage. Needs a burning target."
spell.blizzard.name: "Blizzard"
spell.blizzard.description: "After a 0.7 s warning, creates a radius-4 blizzard for 5 s up to 48 blocks away: 2 damage/s and Slowness II."
spell.frozen_orb.name: "Frozen Orb"
spell.frozen_orb.description: "Explodes on impact: 6→3 damage within 3.5 blocks and Slowness II for 4 s. Can be reflected."
spell.ice_armor.name: "Ice Armor"
spell.ice_armor.description: "Grants 6 absorption health for 5 s. Unspent temporary hearts disappear when it expires."
spell.shatter.name: "Shatter"
spell.shatter.description: "Hits a visible cone up to 9 blocks away: 11 damage against slowed enemies, otherwise 4. Consumes Slowness on hit."
spell.chain_lightning.name: "Chain Lightning"
spell.chain_lightning.description: "Aim at an enemy within 36 blocks: lightning jumps to up to two more enemies within 8 blocks per jump, dealing 8/6/4 damage. Stops at cover."
spell.updraft.name: "Updraft"
spell.updraft.description: "After a 0.7 s warning, creates a radius-3 updraft for 4 s within 48 blocks. Lifts every mage inside; enemies take 1 damage/s."
spell.dispel.name: "Dispel"
spell.dispel.description: "Removes visible enemy projectiles, marked strikes and magic zones within 7 blocks; nearby enemies take 2 damage and are pushed away. Leaves buildings intact."
spell.skyhook.name: "Skyhook"
spell.skyhook.description: "Aim at a block within 32 blocks to launch yourself towards it. Respects physical walls; does not teleport or prevent fall damage."
spell.stone_dome.name: "Stone Dome"
spell.stone_dome.description: "Builds a small 5×5 shelter with a roof around you for 5 s. Skips terrain and bodies; opponents can break its blocks."
spell.fault_line.name: "Fault Line"
spell.fault_line.description: "A narrow piercing ground-level wave travels up to 20 blocks, dealing 8 damage and launching enemies. Solid cover stops it."
spell.erode.name: "Erosion"
spell.erode.description: "After a 0.7 s warning, removes terrain and buildings in radius 4 within 48 blocks. Deals no damage."
spell.pillar.name: "Stone Pillar"
spell.pillar.description: "Raises you 3 blocks on a temporary pillar lasting 8 s. Needs clear space above; cannot push through a ceiling or another player."
spell.purify.name: "Purify"
spell.purify.description: "Removes harmful potion effects, burning and freezing, then heals 2 health. Needs a harmful effect to cleanse."
spell.second_wind.name: "Second Wind"
spell.second_wind.description: "For 8 s, the first lethal hit instead leaves you alive with 6 health and extinguishes you. One trigger; cannot save you from the void."
spell.life_tether.name: "Life Tether"
spell.life_tether.description: "A reflectable projectile deals 5 damage and heals you for 2 health only on a damaging hit."
spell.mana_channel.name: "Mana Channel"
spell.mana_channel.description: "At 65 mana or less, spend 8 mana and stand still without casting for 2 s to regain 48 mana. Movement or damage interrupts; spent mana is not refunded."
spell.silence.name: "Silence"
spell.silence.description: "A reflectable projectile deals 3 damage and prevents the enemy from casting for 2 s. They can still move and build."
spell.swap.name: "Exchange"
spell.swap.description: "Aim at an enemy within 24 blocks to swap positions. Both must stand on solid ground with clear bodies, inside the border."
spell.rewind.name: "Rewind"
spell.rewind.description: "Returns you to your position 3 s ago without changing health, mana or cooldowns. Fails if that position is occupied, blocked or outside the border."
spell.dark_veil.name: "Dark Veil"
spell.dark_veil.description: "Grants invisibility for 5 s and leaves a radius-5 veil for 5 s that briefly blinds visible enemies inside. Held items remain visible."
