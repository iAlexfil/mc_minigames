name: "THE FINALS"
mode.default: "Обналичивание"
description: "Украдите денежный ящик, защитите обналичивание и заработайте больше всех."
players_required: "Для The Finals нужно 2–12 игроков или один игрок для тренировки."
rules: "Две команды. Откройте сейф, принесите ящик и защитите обналичивание: <arg:2> сек. за $<arg:0>. Побеждает команда, первой набравшая $<arg:1>. Для перехвата нужны <arg:3> сек. без прерываний."
controls: "ПКМ: стрелять/использовать гаджеты или открыть двери/люки. Удерживайте ПКМ: лечащий луч. ЛКМ: ближний бой; пустой рукой: разбить стекло. F: перезарядка. Q: метнуть ящик по направлению взгляда. Слот 9: снаряжение. Откройте хранилище, доставьте ящик на A/B и защищайте. Для кражи зажмите Shift и нажмите ПКМ по чужой станции; урон прерывает захват."
practice: "Тренировочный матч: очки рейтинга не начисляются. Можно изучать арену и обналичивать деньги в одиночку."
go: "СТАРТ! Найдите и откройте сейф!"
