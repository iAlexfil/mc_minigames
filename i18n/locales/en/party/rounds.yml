parkour_race.stage.bridge.name: "Bridging"
parkour_race.stage.bridge.hint: "Bridge the 18-block gap with your wool; a few spare blocks are included."
parkour_race.stage.wind_wall.name: "Wind ascent"
parkour_race.stage.wind_wall.hint: "Climb 28 blocks using wind charges and wall placements, or tower up with your wool."
parkour_race.stage.water_drop.name: "Water drop"
parkour_race.stage.water_drop.hint: "Drop 44 blocks and place water before landing. An unprotected lethal fall resets this attempt."
parkour_race.stage.scaffold.name: "Scaffolding tower"
parkour_race.stage.scaffold.hint: "Climb 24 blocks using scaffolding, then cross the short gap."
parkour_race.stage.ladder_climb.name: "Ladder wall"
parkour_race.stage.ladder_climb.hint: "Place ladders on the wall and climb 20 blocks."
parkour_race.stage.slime_bounce.name: "Slime rebound"
parkour_race.stage.slime_bounce.hint: "Place slime on the lower landing pad, land on it and steer the rebound to the next island. Do not sneak."
parkour_race.stage.pearl.name: "Pearl throw"
parkour_race.stage.pearl.hint: "Throw a pearl across the 32-block gap. The clock restores all three pearls if needed."
parkour_race.stage.swim.name: "Swim tunnel"
parkour_race.stage.swim.hint: "Enter the pool and sprint-swim through the one-block-high flooded passage."
parkour_race.stage.ladder_drop.name: "Ladder clutch"
parkour_race.stage.ladder_drop.hint: "Descend along the blue stripe, place a ladder on the wall and catch it. The wall ends before the glowing checkpoint island; land on that island."
parkour_race.stage.web_drop.name: "Cobweb clutch"
parkour_race.stage.web_drop.hint: "Stop a 28-block fall with a cobweb. Use shears to cut it after slowing down."
parkour_race.stage.honey_drop.name: "Honey clutch"
parkour_race.stage.honey_drop.hint: "Use honey to stop the 24-block fall beside the blue stripe. The wall ends before the glowing checkpoint island; move onto that island."
parkour_race.stage.flight.name: "Elytra flight"
parkour_race.stage.flight.hint: "Your elytra is equipped. Use rockets to cross 50 blocks and climb 64 blocks; land on the next checkpoint island."
parkour_race.need_checkpoint: "You must land on the next checkpoint before entering another section."
parkour_race.stage.ladder_traverse.name: "Ladder traverse"
parkour_race.stage.ladder_traverse.hint: "Move 20 blocks sideways with 12 blocks and 12 ladders. Alternate block and ladder placements over the void."
parkour_race.stage.block_ascent.name: "Block staircase"
parkour_race.stage.block_ascent.hint: "Build a staircase 14 blocks forward and 14 up with 32 wool blocks and shears."
parkour_race.stage.pot_ascent.name: "Flower-pot staircase"
parkour_race.stage.pot_ascent.hint: "Move 14 blocks forward and 14 up: put a pot on your block, then place the next block against its side diagonally up. Build in the three columns between the blue markers; broken supports are not returned. The clock restores 16 blocks and 18 pots."

