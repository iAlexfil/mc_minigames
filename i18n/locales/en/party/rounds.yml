parkour_race.instructions: "Seven islands, six random tasks without repeats! Follow your glowing green goal and the direction arrow. Items refresh at each checkpoint. Land on the islands; flying past a checkpoint does not count. Slot 9: right-click to restart the attempt, left-click for the task hint. The race timer keeps running."
