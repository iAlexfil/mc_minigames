gadget.evasive_dash.name: "Уклоняющий рывок"
gadget.evasive_dash.lore: "ПКМ: рывок вперёд. Три заряда восстанавливаются по очереди."
gadget.frag_grenade.name: "Осколочная граната"
gadget.frag_grenade.lore: "ПКМ: бросить гранату. Взрыв через 1,6 с; может задеть вас."
gadget.sonar_grenade.name: "Сонарная граната"
gadget.sonar_grenade.lore: "ПКМ: подсветить врагов в радиусе 9 блоков на 5 с, включая невидимых."
gadget.vanishing_bomb.name: "Маскировочная бомба"
gadget.vanishing_bomb.lore: "ПКМ: скрыть себя и снаряжение от врагов на 5 с. Атака снимает маскировку."
gadget.healing_beam.name: "Лечащий луч"
gadget.healing_beam.lore: "Удерживайте ПКМ для непрерывного лечения видимого союзника; самолечение слабее. Отпустите ПКМ для охлаждения."
gadget.jump_pad.name: "Прыжковая платформа"
gadget.jump_pad.lore: "ПКМ по полу: платформа на 15 с. Наступите на неё для прыжка."
gadget.defibrillator.name: "Дефибриллятор"
gadget.defibrillator.lore: "Наведитесь на статуэтку союзника в пределах 4 блоков и нажмите ПКМ. Держите гаджет и цельтесь 1с; в 2 на 2 и 3 на 3 затем восстановление за 3с с половиной ОЗ и блокировкой гаджетов на 5с."
gadget.revive_sickness: "Слабость после оживления: гаджеты и специализация временно недоступны."
gadget.charge_n_slam.name: "Таран и удар"
gadget.charge_n_slam.lore: "ПКМ: таран на 1 с, разрушение лёгких укрытий и один удар по каждому врагу."
gadget.rpg7.name: "РПГ-7"
gadget.rpg7.lore: "ПКМ: выстрел ракетой. Взрыв ранит врагов и вас, разрушает лёгкие укрытия."
gadget.dome_shield.name: "Купольный щит"
gadget.dome_shield.lore: "ПКМ: щит для команды на 8 с. Враги могут войти; носитель ящика уязвим."
gadget.barricade.name: "Баррикада"
gadget.barricade.lore: "ПКМ по полу: разрушаемое укрытие 3×2 на 20 с."
gadget.cloaking_device.name: "Маскирующее устройство"
gadget.cloaking_device.lore: "Скрывает от врагов на 10 секунд. Атака, урон или денежный ящик снимают маскировку. Повторный ПКМ отменяет её."
gadget.grappling_hook.name: "Крюк-кошка"
gadget.grappling_hook.lore: "ПКМ по твёрдой поверхности в пределах 22 блоков притягивает к ней. Повторный ПКМ отпускает крюк."
gadget.guardian_turret.name: "Защитная турель"
gadget.guardian_turret.lore: "Устанавливает одну разрушаемую турель. Активируется через 2 секунды и стреляет по видимым врагам до 30 секунд."
gadget.dematerializer.name: "Дематериализатор"
gadget.dematerializer.lore: "Временно открывает проход 3×3 в разрушаемой поверхности. Восстановление через 8 секунд, когда проход свободен."
gadget.mesh_shield.name: "Сетчатый щит"
gadget.mesh_shield.lore: "Держите специализацию, чтобы 6 секунд защищать союзников от атак спереди. Смена слота или повторный ПКМ убирает щит."
gadget.winch_claw.name: "Лебёдка"
gadget.winch_claw.lore: "ПКМ по врагу, денежному ящику или станции в пределах 14 блоков притягивает цель. Стены останавливают движение."
gadget.smoke_grenade.name: "Дымовая граната"
gadget.smoke_grenade.lore: "Создаёт дым на 8 секунд, скрывающий врагов и гасящий зоны огня."
gadget.flashbang.name: "Светошумовая граната"
gadget.flashbang.lore: "Ослепляет находящихся рядом видимых врагов на 3 секунды."
gadget.gas_grenade.name: "Газовая граната"
gadget.gas_grenade.lore: "Создаёт ядовитое облако на 8 секунд. Огонь рассеивает газ."
gadget.pyro_grenade.name: "Зажигательная граната"
gadget.pyro_grenade.lore: "При попадании создаёт зону огня на 8 секунд. Дым гасит огонь."
gadget.goo_grenade.name: "Пенная граната"
gadget.goo_grenade.lore: "При попадании создаёт временное разрушаемое укрытие. Защищённые точки остаются свободными."
gadget.breach_charge.name: "Подрывной заряд"
gadget.breach_charge.lore: "Установите дистанционный заряд на полу. После активации повторный ПКМ подрывает его и разрушает ближайшее укрытие."
gadget.explosive_mine.name: "Фугасная мина"
gadget.explosive_mine.lore: "Устанавливает мину, взрывающуюся при приближении видимого врага. Её можно расстрелять."
gadget.gas_mine.name: "Газовая мина"
gadget.gas_mine.lore: "Устанавливает мину, выпускающую газ при приближении видимого врага."
gadget.pyro_mine.name: "Зажигательная мина"
gadget.pyro_mine.lore: "Устанавливает мину, поджигающую область при приближении видимого врага."
gadget.aps_turret.name: "Турель активной защиты"
gadget.aps_turret.lore: "Устанавливает разрушаемую турель, перехватывающую до шести вражеских гранат или ракет в радиусе 3 блоков."
